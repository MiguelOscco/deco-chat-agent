# SonarQube Project Configuration for DECO Chat Agent

# ============================================
# Project Identification
# ============================================
sonar.projectKey=grupo-deco_deco-chat-agent
sonar.projectName=DECO Chat Agent
sonar.projectVersion=1.0.0
sonar.organization=grupo-deco

# ============================================
# Source Code
# ============================================
sonar.sources=server/app
sonar.sourceEncoding=UTF-8
sonar.language=python

# Exclusions
sonar.exclusions=**/tests/**,**/__pycache__/**,**/migrations/**
sonar.test.inclusions=**/tests/**

# ============================================
# Python Specific
# ============================================
sonar.python.version=3.11
sonar.python.pylint_config=.pylintrc
sonar.python.coverage.reportPaths=server/coverage.xml

# ============================================
# Coverage Settings
# ============================================
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py
sonar.python.coverage.reportPath=server/coverage.xml

# Minimum coverage
sonar.coverage.lines.coverage=75
sonar.coverage.branches.coverage=70

# ============================================
# Code Quality Gates
# ============================================
# Quality gates will be configured in SonarCloud UI
# but these are defaults
sonar.qualitygate.timeout=300
sonar.qualitygate.wait=true

# ============================================
# Duplications
# ============================================
sonar.cpd.exclusions=**/tests/**

# ============================================
# Issue Severities
# ============================================
# These can be overridden in SonarCloud UI
sonar.issue.ignore.multicriteria=e1

# Ignore false positives
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=**

# ============================================
# Logging
# ============================================
sonar.verbose=false
sonar.log.level=INFO

# ============================================
# Host
# ============================================
sonar.host.url=https://sonarcloud.io
