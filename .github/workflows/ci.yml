name: CI - Lint, Test, Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd server
          pip install -r requirements-dev.txt
      
      - name: Run Black formatter check
        run: |
          cd server
          black --check app/ --line-length=100
      
      - name: Run isort import check
        run: |
          cd server
          isort --check-only app/
      
      - name: Run Flake8 linter
        run: |
          cd server
          flake8 app/ --max-line-length=100 --count --show-source --statistics
      
      - name: Run mypy type checker
        run: |
          cd server
          mypy app/ --ignore-missing-imports || true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: deco_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd server
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/deco_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          pytest app/tests/unit/ -v --tb=short --cov=app.core --cov=app.validators --cov-report=xml
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/deco_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          pytest app/tests/integration/ -v --tb=short --cov=app.api --cov-report=xml
      
      - name: Run security tests
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/deco_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          pytest app/tests/security/ -v --tb=short --cov=app.validators --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./server/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: deco_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd server
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run all tests with coverage
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/deco_test
          REDIS_URL: redis://localhost:6379
        run: |
          cd server
          pytest app/tests/ --cov=app --cov-report=html --cov-report=term-missing
      
      - name: Generate coverage badge
        run: |
          cd server
          coverage-badge -o coverage.svg -f
      
      - name: Upload coverage as artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: server/htmlcov/

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ lint, test, test-coverage ]

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: server
          file: server/Dockerfile
          push: false
          tags: deco-chat-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
